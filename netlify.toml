# Build command, publish directory, headers, and redirects stay UI-managed
# (see the Netlify site's Build & deploy settings) — the build runs
# `npm run build`, whose `postbuild` lifecycle hook runs
# scripts/trim-netlify-standalone.mjs.
#
# That script removes known-dead weight (sharp/@img native binaries and
# next/font's font-metrics table) from `.next/standalone`, which
# `@netlify/plugin-nextjs` copies verbatim into the `___netlify-server-handler`
# function. It's what keeps the function zip under Netlify's per-function
# upload limit.
#
# NOTE: `[functions] included_files` is NOT a way to shrink this handler — the
# plugin treats it as an additive file list only (`!` exclusion globs are
# ignored for the traced handler bundle), so it's intentionally not used here.
