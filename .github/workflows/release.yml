name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Check whether release-please should run
        id: release-gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')"

          head_ref=""
          release_now="false"
          if [ -n "$pr_number" ]; then
            head_ref="$(gh api "repos/${{ github.repository }}/pulls/$pr_number" --jq '.head.ref // empty')"
            {
              gh api "repos/${{ github.repository }}/pulls/$pr_number" --jq '.body // empty'
              gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --jq '.[].body' 2>/dev/null
              gh api "repos/${{ github.repository }}/pulls/$pr_number/comments" --jq '.[].body' 2>/dev/null
              gh api "repos/${{ github.repository }}/pulls/$pr_number/reviews" --jq '.[].body' 2>/dev/null
            } > pr-thread.txt || true
            if grep -qi 'RELEASE-NOW' pr-thread.txt; then
              release_now="true"
            fi
          fi

          is_bot_release_pr="false"
          case "$head_ref" in
            release-please--*) is_bot_release_pr="true" ;;
          esac

          should_run="false"
          if [ "$release_now" = "true" ] || [ "$is_bot_release_pr" = "true" ]; then
            should_run="true"
          fi

          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "release_now=$release_now" >> "$GITHUB_OUTPUT"
          echo "is_bot_release_pr=$is_bot_release_pr" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        if: ${{ steps.release-gate.outputs.should_run == 'true' }}
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release-gate.outputs.release_now == 'true' && steps.release-gate.outputs.is_bot_release_pr != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<< "$RELEASE_PR_JSON")"
          pr_title="$(jq -r '.title' <<< "$RELEASE_PR_JSON")"

          emojis=(🚀 📦 🔖 🎉 🏷️ ✨)
          emoji="${emojis[$RANDOM % ${#emojis[@]}]}"
          title="$emoji $pr_title"

          gh pr merge "$pr_number" --squash --auto --subject "$title" -R "${{ github.repository }}"

      - name: Revalidate marketing site download page
        if: ${{ steps.release.outputs.release_created == 'true' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          response="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ] || ! grep -q '"revalidated":true' <<< "$body"; then
            echo "::error::Download page revalidation failed (HTTP $code): $body"
            exit 1
          fi
          echo "Download page revalidated: $body"

  revalidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate marketing site download page
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          response="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ] || ! grep -q '"revalidated":true' <<< "$body"; then
            echo "::error::Download page revalidation failed (HTTP $code): $body"
            exit 1
          fi
          echo "Download page revalidated: $body"
