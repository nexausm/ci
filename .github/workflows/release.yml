name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Revalidate marketing site download page
        if: ${{ steps.release.outputs.release_created == 'true' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          response="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ] || ! grep -q '"revalidated":true' <<< "$body"; then
            echo "::error::Download page revalidation failed (HTTP $code): $body"
            exit 1
          fi
          echo "Download page revalidated: $body"

  revalidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate marketing site download page
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          response="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ] || ! grep -q '"revalidated":true' <<< "$body"; then
            echo "::error::Download page revalidation failed (HTTP $code): $body"
            exit 1
          fi
          echo "Download page revalidated: $body"
