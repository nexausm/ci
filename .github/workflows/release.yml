name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: What to run
        type: choice
        options:
          - release
          - revalidate
        default: release

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # "Run workflow" → release: open (or refresh) the release PR from everything
  # merged since the last tag, then auto-merge it once checks pass.
  release-now:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-release: true

      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_json="$(gh pr list -R "${{ github.repository }}" --state open \
            --label 'autorelease: pending' --json number,title --jq '.[0] // empty')"
          if [ -z "$pr_json" ]; then
            echo "::notice::Nothing to release: no releasable changes since the last tag."
            exit 0
          fi

          pr_number="$(jq -r '.number' <<< "$pr_json")"
          pr_title="$(jq -r '.title' <<< "$pr_json")"

          emojis=(🚀 📦 🔖 🎉 🏷️ ✨)
          emoji="${emojis[$RANDOM % ${#emojis[@]}]}"

          gh pr merge "$pr_number" --squash --auto --subject "$emoji $pr_title" -R "${{ github.repository }}"
          echo "::notice::Release PR #$pr_number will merge once checks pass."

  # Push to main: never opens a release PR. Only acts when the push is the
  # merged release PR, turning it into a tag + GitHub release.
  tag-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          skip-github-pull-request: true

      - name: Revalidate marketing site download page
        if: ${{ steps.release.outputs.release_created == 'true' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          response="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ] || ! grep -q '"revalidated":true' <<< "$body"; then
            echo "::error::Download page revalidation failed (HTTP $code): $body"
            exit 1
          fi
          echo "Download page revalidated: $body"

  revalidate:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'revalidate'
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate marketing site download page
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          response="$(curl -sS --max-time 30 --retry 3 --retry-all-errors -w '\n%{http_code}' -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ] || ! grep -q '"revalidated":true' <<< "$body"; then
            echo "::error::Download page revalidation failed (HTTP $code): $body"
            exit 1
          fi
          echo "Download page revalidated: $body"
