name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Check whether the merged PR asked for an immediate release
        id: release-gate
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')"

          release_now="false"
          if [ -n "$pr_number" ]; then
            {
              gh api "repos/${{ github.repository }}/pulls/$pr_number" --jq '.body // empty'
              gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --jq '.[].body' 2>/dev/null
              gh api "repos/${{ github.repository }}/pulls/$pr_number/comments" --jq '.[].body' 2>/dev/null
              gh api "repos/${{ github.repository }}/pulls/$pr_number/reviews" --jq '.[].body' 2>/dev/null
            } > pr-thread.txt || true
            if grep -qi 'RELEASE-NOW' pr-thread.txt; then
              release_now="true"
            fi
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "release_now=$release_now" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' && steps.release-gate.outputs.release_now == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          pr_number="$(jq -r '.number' <<< "$RELEASE_PR_JSON")"
          pr_title="$(jq -r '.title' <<< "$RELEASE_PR_JSON")"

          emojis=(🚀 📦 🔖 🎉 🏷️ ✨)
          emoji="${emojis[$RANDOM % ${#emojis[@]}]}"
          title="$emoji $pr_title"

          gh pr merge "$pr_number" --squash --auto --subject "$title" -R "${{ github.repository }}"

      - name: Revalidate marketing site download page
        if: ${{ steps.release.outputs.release_created == 'true' }}
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-all-errors -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET"

  revalidate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Revalidate marketing site download page
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS --max-time 30 --retry 3 --retry-all-errors -X POST \
            "https://invoice.nexaus.cloud/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET"
