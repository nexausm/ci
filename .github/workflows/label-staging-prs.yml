name: Label staging to main PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write

jobs:
  label:
    name: Label staging to main PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.ref == 'staging'
    steps:
      - uses: actions/checkout@v4

      - name: Apply do-not-review label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-label "do-not-review"
