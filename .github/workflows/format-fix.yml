name: Format staging after merge

on:
  push:
    branches: [staging]

concurrency:
  group: format-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORMAT_BRANCH: chore/prettier-autofix
  FORMAT_TITLE: "style: apply prettier formatting [bot]"

jobs:
  format:
    name: prettier
    if: "${{ !contains(github.event.head_commit.message || '', 'style: apply prettier formatting [bot]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format
        run: npm run format

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff --stat --cached
          fi

      - name: Open and merge a formatting PR
        if: steps.diff.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          emojis=(🎨 🧹 💅 ✨ 🧼)
          emoji="${emojis[$RANDOM % ${#emojis[@]}]}"
          title="$emoji $FORMAT_TITLE"

          bot_user_id="$(gh api "users/${BOT_SLUG}[bot]" --jq '.id')"
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_user_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$FORMAT_BRANCH"
          git commit -m "$title"

          git push --force origin "HEAD:refs/heads/$FORMAT_BRANCH"

          pr="$(gh pr list --base staging --head "$FORMAT_BRANCH" \
            --state open --json url --jq '.[0].url // ""')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base staging --head "$FORMAT_BRANCH" \
              --title "$title" \
              --body "Automated \`npm run format\` output, opened and merged by the format bot.")"
          fi
          echo "Formatting PR: $pr"

          for _ in $(seq 1 12); do
            state="$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)"
            echo "mergeStateStatus=$state"
            [ "$state" = CLEAN ] && break
            sleep 5
          done

          if gh pr merge "$pr" --squash --delete-branch \
            --subject "$title" \
            --body "Automated prettier run."; then
            echo "::notice::Merged $pr into staging"
            exit 0
          fi

          if gh pr merge "$pr" --squash --auto; then
            echo "::notice::Auto-merge enabled on $pr"
            exit 0
          fi

          echo "::error::Could not merge $pr; formatting was not applied."
          exit 1
