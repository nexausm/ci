name: Format staging after merge

on:
  push:
    branches: [staging]

concurrency:
  group: format-staging
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORMAT_BRANCH: chore/prettier-autofix
  FORMAT_TITLE: "style: apply prettier formatting [bot]"

jobs:
  format:
    name: prettier
    if: "${{ !startsWith(github.event.head_commit.message || '', 'style: apply prettier formatting [bot]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          token: ${{ secrets.STAGING_FORMAT_TOKEN }}

      - name: Fail early if no token is configured
        env:
          TOKEN: ${{ secrets.STAGING_FORMAT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::STAGING_FORMAT_TOKEN is not set. Create a fine-grained"
            echo "::error::PAT with Contents: write + Pull requests: write on"
            echo "::error::$GITHUB_REPOSITORY and add its owner to the bypass list"
            echo "::error::of the 'nmc' ruleset (for pull requests only)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format
        run: npm run format

      - name: Detect changes
        id: diff
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "changed=1" >> "$GITHUB_OUTPUT"
            git diff --stat --cached
          fi

      - name: Open and merge a formatting PR
        if: steps.diff.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.STAGING_FORMAT_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "opencode-format-bot"
          git config user.email "opencode-format-bot@users.noreply.github.com"
          git checkout -B "$FORMAT_BRANCH"
          git commit -m "$FORMAT_TITLE"

          git push --force origin "HEAD:refs/heads/$FORMAT_BRANCH"

          pr="$(gh pr list --base staging --head "$FORMAT_BRANCH" \
            --state open --json url --jq '.[0].url // ""')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base staging --head "$FORMAT_BRANCH" \
              --title "$FORMAT_TITLE" \
              --body "Automated \`npm run format\` output, opened and merged by the format bot.")"
          fi
          echo "Formatting PR: $pr"

          for _ in $(seq 1 12); do
            state="$(gh pr view "$pr" --json mergeStateStatus --jq .mergeStateStatus)"
            echo "mergeStateStatus=$state"
            [ "$state" = CLEAN ] && break
            sleep 5
          done

          if gh pr merge "$pr" --squash --delete-branch \
            --subject "$FORMAT_TITLE" \
            --body "Automated prettier run."; then
            echo "::notice::Merged $pr into staging"
            exit 0
          fi

          if gh pr merge "$pr" --squash --auto; then
            echo "::notice::Auto-merge enabled on $pr"
            exit 0
          fi

          echo "::error::Could not merge $pr; formatting was not applied."
          exit 1
