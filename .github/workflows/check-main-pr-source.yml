name: Check PR source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert source is nexausm/ci:staging or a release-please PR
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          if [ "$HEAD_REPO" = "nexausm/ci" ] && [ "$HEAD_REF" = "staging" ]; then
            echo "OK: PR into main originates from nexausm/ci:staging"
          elif [ "$HEAD_REPO" = "nexausm/ci" ] && [ "$PR_AUTHOR_TYPE" = "Bot" ] && [[ "$HEAD_REF" == release-please--branches--main* ]]; then
            echo "OK: release-please automation PR"
          else
            echo "::error::PRs into main are only allowed from nexausm/ci:staging or an automated release-please PR (got ${HEAD_REPO}:${HEAD_REF} by ${PR_AUTHOR})"
            exit 1
          fi
