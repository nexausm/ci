name: Check PR source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Assert source is nexausm/ci:staging or a release-please PR
        run: |
          repo="${{ github.event.pull_request.head.repo.full_name }}"
          ref="${{ github.event.pull_request.head.ref }}"
          author="${{ github.event.pull_request.user.login }}"

          if [ "$repo" = "nexausm/ci" ] && [ "$ref" = "staging" ]; then
            echo "OK: PR into main originates from nexausm/ci:staging"
          elif [ "$repo" = "nexausm/ci" ] && [ "$author" = "github-actions[bot]" ] && [[ "$ref" == release-please--branches--main* ]]; then
            echo "OK: release-please automation PR"
          else
            echo "::error::PRs into main are only allowed from nexausm/ci:staging or an automated release-please PR (got ${repo}:${ref} by ${author})"
            exit 1
          fi
