name: Cloudflare preview deploy

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "site/**"
      - ".github/**"
      - "*.md"
      - "LICENSE"
      - ".claude/**"
      - ".agents/**"
      - "skills-lock.json"
      - ".coderabbit.yaml"
      - ".editorconfig"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".env.example"
      - ".gitattributes"
      - "deno.lock"
      - "release-please-config.json"
      - ".release-please-manifest.json"

concurrency:
  group: preview-deploy-cloudflare-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

jobs:
  preflight:
    name: DB Preflight
    if: github.event.action != 'closed' && github.event.pull_request.head.ref != 'chore/prettier-autofix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the database is reachable
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:preflight

  deploy:
    name: Build & deploy Cloudflare preview
    if: github.event.action != 'closed' && github.event.pull_request.head.ref != 'chore/prettier-autofix'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write build-time env
        run: |
          cat > .env <<'EOF'
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      - name: Build & deploy Cloudflare preview
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run cf:build
          WORKER="nci-pr-${{ github.event.pull_request.number }}"
          node - "$WORKER" <<'EOF'
          const fs = require("fs");
          const name = process.argv[2];
          const raw = fs
            .readFileSync("wrangler.jsonc", "utf8")
            .replace(/\/\/.*$/gm, "")
            .replace(/\/\*[\s\S]*?\*\//g, "")
            .replace(/,\s*([}\]])/g, "$1");
          const cfg = JSON.parse(raw);
          cfg.name = name;
          cfg.services = [{ binding: "WORKER_SELF_REFERENCE", service: name }];
          fs.writeFileSync("wrangler.preview.jsonc", JSON.stringify(cfg, null, 2));
          EOF
          npx wrangler deploy --config wrangler.preview.jsonc > wrangler-deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler-deploy.log | head -1)
          test -n "$URL" || { cat wrangler-deploy.log; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test preview URL
        id: smoke
        if: always() && steps.cloudflare.outputs.url != ''
        run: |
          url="${{ steps.cloudflare.outputs.url }}"
          code=000
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 120 "$url" || true)
            case "$code" in
              2*|3*) break ;;
            esac
            sleep 15
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Post preview URL on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.cloudflare.outputs.url }}
          CODE: ${{ steps.smoke.outputs.code }}
        with:
          script: |
            const url = process.env.URL || null;
            const code = process.env.CODE || "";
            const ok = /^[23]\d\d$/.test(code);
            const status = !url ? "failed" : ok ? code : `failed (${code})`;
            const marker = "<!-- preview-deploy-report-cloudflare -->";
            const body = [
              "### Cloudflare Workers preview deployment",
              "",
              "| Status | URL |",
              "|---|---|",
              `| ${status} | ${url ? `[${url}](${url})` : "-"} |`,
              "",
              marker,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if preview is missing or unhealthy
        if: always()
        env:
          URL: ${{ steps.cloudflare.outputs.url }}
          CODE: ${{ steps.smoke.outputs.code }}
        run: |
          if [ -z "$URL" ]; then
            echo "Cloudflare deploy failed (no URL produced)"
            exit 1
          fi
          case "$CODE" in
            2??|3??) ;;
            *) echo "unhealthy preview: $CODE"; exit 1 ;;
          esac

  cleanup:
    name: Cleanup Cloudflare preview worker
    if: github.event.action == 'closed' && github.event.pull_request.head.ref != 'chore/prettier-autofix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete preview worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -fsS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/nci-pr-${{ github.event.pull_request.number }}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -o /dev/null \
            || echo "no preview worker to delete (or already deleted)"
